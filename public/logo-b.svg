<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bookGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bookGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Base / estante -->
  <rect x="20" y="150" width="160" height="12" rx="3" fill="#1e293b"/>

  <!-- Libro 1 (inclinado) -->
  <g transform="translate(38,60) rotate(-8)">
    <rect x="0" y="0" width="26" height="92" rx="3" fill="url(#bookGrad1)"/>
    <rect x="0" y="0" width="6" height="92" rx="2" fill="#1d4ed8"/>
  </g>

  <!-- Libro 2 (recto) -->
  <rect x="72" y="46" width="26" height="106" rx="3" fill="url(#bookGrad2)"/>
  <rect x="72" y="46" width="6" height="106" rx="2" fill="#2563eb"/>

  <!-- Libro 3 (recto, más alto) -->
  <rect x="106" y="34" width="26" height="118" rx="3" fill="url(#bookGrad3)"/>
  <rect x="106" y="34" width="6" height="118" rx="2" fill="#3b82f6"/>

  <!-- Libro 4 (inclinado hacia el otro lado) -->
  <g transform="translate(146,58) rotate(8)">
    <rect x="0" y="0" width="24" height="90" rx="3" fill="url(#bookGrad1)"/>
    <rect x="0" y="0" width="6" height="90" rx="2" fill="#1d4ed8"/>
  </g>
</svg>
